[package]
name = "todoro"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "A vim-style terminal todo app"
license = "MIT"
repository = "https://github.com/Laurenz-Guevara/todoro"
readme = "README.md"
keywords = ["todo", "tui", "terminal", "vim", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
